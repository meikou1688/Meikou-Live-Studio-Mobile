name: Export verified build for local signing
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android build run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e '.conclusion == "success" and .event == "push" and .head_branch == "main" and .path == ".github/workflows/android.yml"'
      - uses: actions/download-artifact@v4
        with:
          name: android-build-and-transport
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Export content-addressed signing input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, pathlib, subprocess
          apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk").read_bytes()
          archive = gzip.compress(apk, mtime=0)
          for start in range(0, len(archive), 36000):
              content = base64.b64encode(archive[start:start+36000]).decode()
              result = subprocess.check_output(["gh", "api", "-X", "POST", "repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/blobs",
                                                "--input", "-", "--jq", ".sha"], input=json.dumps({"content":content,"encoding":"utf-8"}).encode())
              print("signing-part", start, result.decode().strip(), flush=True)
          PY
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          cat build/transport-results.json
