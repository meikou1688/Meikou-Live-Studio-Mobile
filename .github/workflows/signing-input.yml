name: Export verified build for local signing
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android build run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e '.conclusion == "success" and .event == "push" and .head_branch == "main" and .path == ".github/workflows/android.yml"'
      - uses: actions/download-artifact@v4
        with:
          name: android-build-and-transport
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Export content-addressed signing input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' | gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha'
          import base64, json, pathlib
          apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk").read_bytes()
          print(json.dumps({"encoding": "base64", "content": base64.b64encode(apk).decode()}))
          PY
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          cat build/transport-results.json
