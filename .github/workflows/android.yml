name: Android build and transport tests
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK
        run: gradle :app:assembleDebug --console=plain
      - name: Install media test tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg socat
      - name: Decode media received over TCP and UDP
        run: |
          export GRADLE_HOME="$(dirname "$(dirname "$(realpath "$(command -v gradle)")")")"
          python3 tools/test_transport.py
          timeout 45 bash tools/test_rtmps.sh
          timeout 55 bash tools/test_reconnect.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-transport
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/transport-results.json

  camera-background:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -PstudioTestBuildType=preview :app:assembleDebug :app:assemblePreview :app:assemblePreviewAndroidTest --console=plain
      - name: Check standalone test package
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/preview/app-preview.apk
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/preview-badging.txt"
          grep -F "package: name='tw.meikou.live.preview'" "$RUNNER_TEMP/preview-badging.txt"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet opencv-python-headless==4.11.0.86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            MEIKOU_TEST_VARIANT=preview bash tools/test_background.sh rtmp
            MEIKOU_TEST_VARIANT=preview bash tools/test_background.sh srt
            MEIKOU_TEST_VARIANT=preview bash tools/test_background.sh srt-hevc
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-preview-apk
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-background-evidence
          path: |
            build/instrumentation.txt
            build/background*results.json
            build/lane-*.json
            build/*-timing.json
            build/receiver.log
