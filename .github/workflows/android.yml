name: Android build and transport tests
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK
        run: gradle :app:assembleDebug --console=plain
      - name: Install media test tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Decode media received over TCP and UDP
        run: |
          export GRADLE_HOME="$(dirname "$(dirname "$(realpath "$(command -v gradle)")")")"
          python3 tools/test_transport.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-transport
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/transport-results.json
